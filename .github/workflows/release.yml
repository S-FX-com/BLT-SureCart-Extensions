name: Release

# Builds an installable plugin zip and publishes it as a private GitHub
# Release whenever the plugin's Version header changes on main. This is
# the update source that src/Support/UpdateChecker.php (plugin-update-checker,
# enableReleaseAssets()) polls on every client site.
on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read plugin version
        id: version
        run: |
          VERSION=$(grep -m1 "^ \* Version:" blt-surecart-extensions.php | sed -E 's/^[^:]*:\s*//')
          if [ -z "$VERSION" ]; then
            echo "::error::Could not read a Version header from blt-surecart-extensions.php"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Skip if this version was already released
        id: tag_check
        run: |
          if git rev-parse "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up PHP
        if: steps.tag_check.outputs.exists == 'false'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          tools: composer
          coverage: none

      - name: Install Composer dependencies (production only)
        if: steps.tag_check.outputs.exists == 'false'
        run: composer install --no-dev --optimize-autoloader --prefer-dist

      - name: Set up Node
        if: steps.tag_check.outputs.exists == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # PressShip (Automattic/pressship) is a WordPress.org SVN publishing
      # tool, not a GitHub-release tool (tasks/00-discovery.md §F) — it is
      # used here only for its `verify` command (readme.txt validation +
      # the WordPress.org Plugin Check linter) as an advisory quality gate.
      # Its login/submit/release commands require an interactive
      # WordPress.org browser session and are never invoked in CI. This
      # plugin is privately distributed (this workflow, not WordPress.org),
      # so a verify failure is surfaced but never blocks the release.
      - name: PressShip verify (advisory only)
        if: steps.tag_check.outputs.exists == 'false'
        run: npx --yes pressship@0.2.2 verify . || echo "::warning::pressship verify reported issues (or is unavailable in this CI environment) — not blocking the release"
        continue-on-error: true

      - name: Build release zip
        if: steps.tag_check.outputs.exists == 'false'
        run: |
          mkdir -p build/blt-surecart-extensions
          rsync -a --exclude-from='.distignore' ./ build/blt-surecart-extensions/
          (cd build && zip -r ../blt-surecart-extensions.zip blt-surecart-extensions)

      - name: Create GitHub Release
        if: steps.tag_check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: blt-surecart-extensions.zip
